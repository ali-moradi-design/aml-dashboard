name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the Prisma client is generated, not committed
      - run: pnpm --filter @aml/api db:generate
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm --filter @aml/web lint
      - run: pnpm --filter @aml/api test
      - run: pnpm --filter @aml/api build
      - run: pnpm --filter @aml/web build

  # One stable name to mark as the required status check in the ruleset.
  ci:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
        run: test "$CHECKS" = success
