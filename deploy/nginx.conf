# aml-dashboard.ali-moradi-develop.com: /api/ -> api on 127.0.0.1:3107 (REST and Socket.IO),
# everything else -> web on 127.0.0.1:3106. One origin, so the session cookie reaches both.
# Save as /etc/nginx/sites-available/aml-dashboard, symlink into sites-enabled,
# `nginx -t`, `systemctl reload nginx`. certbot --nginx then adds the TLS block;
# edit the live file by hand after that.
server {
    listen 80;
    listen [::]:80;
    server_name aml-dashboard.ali-moradi-develop.com;

    server_tokens off;
    # largest upload is a 5 MB case document (the API checks the exact limits)
    client_max_body_size 6m;

    # the trailing slash strips the prefix: /api/cases -> /cases on the API
    location /api/ {
        proxy_pass http://127.0.0.1:3107/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # always overwrite: visitors cannot choose their own IP (upload limits)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO (/api/socket.io/) is a WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
